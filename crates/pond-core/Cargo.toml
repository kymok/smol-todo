[package]
name = "pond-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
fs2 = "0.4"
rand = "0.8"
thiserror = "1"
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
