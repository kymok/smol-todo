[package]
name = "taskpond-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "taskpond_cli"
path = "src/lib.rs"

[[bin]]
name = "taskpond"
path = "src/main.rs"

[dependencies]
pond-core = { path = "../pond-core" }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = { workspace = true }
